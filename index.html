<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Oportunidades — Porto</title>
<meta name="description" content="Vagas de emprego e editais de pesquisa na região do Porto, atualizado todo dia" />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#4f46e5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Vagas Porto" />

<style>
  :root {
    --bg: #f4f4f8;
    --card-bg: #ffffff;
    --text: #1c1c28;
    --muted: #6b6b7b;
    --accent: #4f46e5;
    --border: #e6e6ef;
    --chip-escritorio: #e0f2e9; --chip-escritorio-text: #1a7a4c;
    --chip-indefinido: #eef0fb; --chip-indefinido-text: #4f46e5;
    --chip-operacional: #faece0; --chip-operacional-text: #b4590f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121218; --card-bg: #1c1c26; --text: #f0f0f5; --muted: #9a9aab;
      --accent: #8b85f5; --border: #2c2c3a;
      --chip-escritorio: #163826; --chip-escritorio-text: #6fe3a6;
      --chip-indefinido: #272a52; --chip-indefinido-text: #b3aeff;
      --chip-operacional: #3a2814; --chip-operacional-text: #f2a85c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 48px;
  }
  header {
    padding: 20px 16px 12px; position: sticky; top: 0; background: var(--bg);
    z-index: 5; border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin: 0; }
  .filtros { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; padding-bottom: 2px; }
  .filtros-situacao { margin-top: 6px; }
  .historico-titulo { font-size: 1rem; margin: 4px 0 12px; }
  .hugo-chip {
    background: #ede9fe; color: #5b21b6;
  }
  .hugo-chip.baixa_compatibilidade { background: #fee2e2; color: #991b1b; }
  .hugo-chip.precisa_verificar { background: #fef3c7; color: #92400e; }
  .hugo-chip.prioritaria { background: #dcfce7; color: #166534; }
  .hugo-detalhes {
    display: block;
    margin-top: 8px;
    color: var(--muted);
    font-size: 0.78rem;
    line-height: 1.45;
  }
  .hugo-detalhes b { color: var(--text); }
  .filtro-btn {
    border: 1px solid var(--border); background: var(--card-bg); color: var(--text);
    border-radius: 999px; padding: 6px 14px; font-size: 0.82rem; white-space: nowrap;
    cursor: pointer;
  }
  .filtro-btn.ativo { background: var(--accent); color: white; border-color: var(--accent); }
  main { padding: 12px 16px; max-width: 720px; margin: 0 auto; }
  .vaga {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 10px; text-decoration: none; color: inherit; display: block;
  }
  .vaga-titulo { font-weight: 600; font-size: 0.98rem; margin-bottom: 4px; }
  .vaga-meta { color: var(--muted); font-size: 0.82rem; display: flex; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 8px; }
  .chip {
    display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 600;
  }
  .chip.escritorio { background: var(--chip-escritorio); color: var(--chip-escritorio-text); }
  .chip.indefinido { background: var(--chip-indefinido); color: var(--chip-indefinido-text); }
  .chip.operacional { background: var(--chip-operacional); color: var(--chip-operacional-text); }
  .chip.situacao-observada { background: #dcfce7; color: #166534; }
  .chip.situacao-por_confirmar { background: #fef3c7; color: #92400e; }
  .chip.situacao-encerrada { background: #e5e7eb; color: #374151; }
  .chip.manual { background: #fde2e2; color: #9b1c1c; }
  .historico-titulo { font-size: 1rem; margin: 4px 0 12px; }
  .estado {
    text-align: center; color: var(--muted); padding: 60px 20px; font-size: 0.92rem; line-height: 1.5;
  }
  .install-hint {
    margin: 0 16px 16px; padding: 12px 14px; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; font-size: 0.8rem; color: var(--muted); display: none;
  }
  .install-hint.mostrar { display: block; }
  .install-hint b { color: var(--text); }
</style>
</head>
<body>

<header>
  <h1>Oportunidades — Porto e região</h1>
  <p class="sub" id="status">A carregar…</p>
  <div class="filtros" id="filtros-classificacao"></div>
  <div class="filtros filtros-situacao" id="filtros-situacao"></div>
  <div class="filtros filtros-hugo" id="filtros-hugo"></div>
</header>

<div class="install-hint" id="install-hint">
  📱 Pra ter isso como app no iPhone: toque no botão de <b>Partilhar</b> do Safari e depois em
  <b>"Adicionar ao ecrã principal"</b>.
</div>

<main id="lista">
  <p class="estado">A carregar vagas…</p>
</main>

<script src="compatibilidade.js"></script>
<script>
const NOMES_CLASSE = { escritorio: "Escritório", indefinido: "A conferir", operacional: "Operacional" };
let TODAS = [];
let filtroClassificacao = "todas";
let filtroSituacao = "todas";
let filtroMelhoresHugo = false;
let PERFIL_HUGO = null;
const NOMES_SITUACAO = {
  observada: "Observada",
  por_confirmar: "Por confirmar",
  encerrada: "Encerrada",
};

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

const DATA_LISBOA = new Intl.DateTimeFormat("pt-PT", {
  dateStyle: "short", timeStyle: "short", timeZone: "Europe/Lisbon",
});
const MODALIDADES = { remoto: "Remoto", hibrido: "Híbrido", presencial: "Presencial", desconhecido: "Modalidade desconhecida" };
const ELEGIBILIDADE_REMOTA = {
  confirmada: "Elegibilidade em Portugal confirmada no anúncio",
  provavel: "Elegibilidade em Portugal por confirmar",
  nao_verificada: "Elegibilidade em Portugal não verificada",
};

function dataLisboa(valor) {
  const data = new Date(valor || "");
  return Number.isNaN(data.getTime()) ? "Sem data registada" : `${DATA_LISBOA.format(data)} (Europe/Lisbon)`;
}

function ultimaObservacao(vaga) {
  if (vaga.fonte === "outros_institutos") {
    return "Referência de consulta manual — não coletada automaticamente";
  }
  const situacao = vaga.situacao || (vaga.verificacao_pendente ? "por_confirmar" : "observada");
  const ultima = vaga.ultima_observacao || vaga.coletado_em;
  if (situacao === "encerrada") {
    return `Histórico · última vez vista: ${dataLisboa(ultima)}${vaga.evidencia_encerramento ? ` · ${escapeHtml(vaga.evidencia_encerramento)}` : ""}`;
  }
  return `Última vez vista: ${dataLisboa(ultima)}${situacao === "por_confirmar" ? " · por confirmar" : ""}`;
}

function avaliacaoHugo(vaga) {
  if (window.CompatibilidadeHugo) {
    return window.CompatibilidadeHugo.avaliar(vaga, PERFIL_HUGO);
  }
  return {
    classificacao: "precisa_verificar",
    afinidade: "insuficiente",
    justificativa: "Informações insuficientes para uma recomendação fundamentada.",
    impedimentos_obrigatorios: [],
    informacoes_desconhecidas: ["Requisitos obrigatórios", "Requisitos preferenciais"],
  };
}

function filtrarVagas(vagas, classificacao, situacao, melhoresHugo = false) {
  const situacaoDe = v => v.situacao || (v.verificacao_pendente ? "por_confirmar" : "observada");
  return vagas.filter(v => {
    const classificacaoCorresponde = classificacao === "todas" || v.classificacao === classificacao;
    const situacaoAtual = situacaoDe(v);
    const situacaoCorresponde = situacao === "todas"
      ? situacaoAtual !== "encerrada"
      : situacaoAtual === situacao;
    const hugoCorresponde = !melhoresHugo ||
      avaliacaoHugo(v).classificacao === "prioritaria";
    return classificacaoCorresponde && situacaoCorresponde && hugoCorresponde;
  });
}

function render() {
  const lista = document.getElementById("lista");
  const situacaoDe = v => v.situacao || (v.verificacao_pendente ? "por_confirmar" : "observada");
  const vagas = filtrarVagas(TODAS, filtroClassificacao, filtroSituacao, filtroMelhoresHugo);

  if (vagas.length === 0) {
    if (filtroMelhoresHugo) {
      lista.innerHTML = `
        <p class="estado">Nenhuma oportunidade possui informações suficientes para receber prioridade no momento.
        Outras vagas continuam disponíveis para análise.</p>
        <button class="filtro-btn" id="ver-todas-hugo" type="button"
                aria-label="Ver todas as oportunidades e desativar o filtro de prioridade para Hugo">
          Ver todas as oportunidades
        </button>
      `;
      document.getElementById("ver-todas-hugo").addEventListener("click", () => {
        filtroMelhoresHugo = false;
        montarFiltros();
        render();
      });
    } else {
      lista.innerHTML = '<p class="estado">Nenhuma oportunidade acompanha esses filtros no momento.</p>';
    }
    return;
  }

  const tituloSecao = filtroSituacao === "encerrada"
    ? '<h2 class="historico-titulo">Histórico de vagas encerradas</h2>'
    : "";

  lista.innerHTML = tituloSecao + vagas.map(v => {
    const temLink = /^https?:\/\//i.test(v.link || "");
    const situacao = situacaoDe(v);
    const avaliacao = avaliacaoHugo(v);
    const rotuloHugo = {
      prioritaria: "Prioritária para Hugo",
      precisa_verificar: "Precisa verificar",
      baixa_compatibilidade: "Baixa compatibilidade",
    }[avaliacao.classificacao] || "Precisa verificar";
    const impedimentos = avaliacao.impedimentos_obrigatorios && avaliacao.impedimentos_obrigatorios.length
      ? `<div><b>Impeditivo:</b> ${escapeHtml(avaliacao.impedimentos_obrigatorios.join(" "))}</div>`
      : "";
    const desconhecidas = avaliacao.informacoes_desconhecidas && avaliacao.informacoes_desconhecidas.length
      ? `<div><b>A verificar:</b> ${escapeHtml(avaliacao.informacoes_desconhecidas.join(", "))}</div>`
      : "";
    const abertura = temLink
      ? `<a class="vaga" href="${escapeHtml(v.link)}" target="_blank" rel="noopener">`
      : '<article class="vaga">';
    return `
    ${abertura}
      <div class="vaga-titulo">${escapeHtml(v.titulo)}</div>
      <div class="vaga-meta">
        <span>${escapeHtml(v.empresa)}</span>
        ${v.cidade ? `<span>· ${escapeHtml(v.cidade)}</span>` : ""}
        ${v.tipo_contrato ? `<span>· ${escapeHtml(v.tipo_contrato)}</span>` : ""}
        ${MODALIDADES[v.modalidade] ? `<span>· ${MODALIDADES[v.modalidade]}</span>` : ""}
        ${v.modalidade === "remoto" && ELEGIBILIDADE_REMOTA[v.elegibilidade_portugal] ?
          `<span>· ${ELEGIBILIDADE_REMOTA[v.elegibilidade_portugal]}</span>` : ""}
      </div>
      <div class="vaga-meta">${escapeHtml(ultimaObservacao(v))}${temLink ? "" : " · Link por confirmar"}</div>
      <span class="chip ${v.classificacao}">${NOMES_CLASSE[v.classificacao] || v.classificacao}</span>
      <span class="chip situacao-${situacao}">${NOMES_SITUACAO[situacao] || situacao}</span>
      ${v.fonte === "outros_institutos" ? '<span class="chip manual">Consulta manual</span>' : ""}
      <span class="chip hugo-chip ${avaliacao.classificacao}" role="status"
            aria-label="Avaliação para Hugo: ${escapeHtml(rotuloHugo)}">${rotuloHugo}</span>
      <div class="hugo-detalhes">
        <div><b>Justificação:</b> ${escapeHtml(avaliacao.justificativa)}</div>
        ${impedimentos}
        ${desconhecidas}
      </div>
    ${temLink ? "</a>" : "</article>"}
  `;
  }).join("");
}

function montarFiltros() {
  const situacaoDe = v => v.situacao || (v.verificacao_pendente ? "por_confirmar" : "observada");
  const contagemClassificacao = chave => filtrarVagas(
    TODAS, chave, filtroSituacao
  ).length;
  const contagemSituacao = chave => filtrarVagas(
    TODAS, filtroClassificacao, chave
  ).length;

  const elClassificacao = document.getElementById("filtros-classificacao");
  const gruposClassificacao = [
    ["todas", "Todas"],
    ["escritorio", "Escritório"],
    ["indefinido", "A conferir"],
    ["operacional", "Operacional"],
  ];
  elClassificacao.innerHTML = gruposClassificacao.map(([chave, rotulo]) => `
    <button class="filtro-btn ${chave === filtroClassificacao ? "ativo" : ""}" data-classificacao="${chave}">
      ${rotulo} (${contagemClassificacao(chave)})
    </button>
  `).join("");

  elClassificacao.querySelectorAll(".filtro-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      filtroClassificacao = btn.dataset.classificacao;
      montarFiltros();
      render();
    });
  });

  const elSituacao = document.getElementById("filtros-situacao");
  const gruposSituacao = [
    ["todas", "Todas situações"],
    ["observada", "Observada"],
    ["por_confirmar", "Por confirmar"],
    ["encerrada", "Encerrada · histórico"],
  ];
  elSituacao.innerHTML = gruposSituacao.map(([chave, rotulo]) => `
    <button class="filtro-btn ${chave === filtroSituacao ? "ativo" : ""}" data-situacao="${chave}">
      ${rotulo} (${contagemSituacao(chave)})
    </button>
  `).join("");

  elSituacao.querySelectorAll(".filtro-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      filtroSituacao = btn.dataset.situacao;
      montarFiltros();
      render();
    });
  });

  const elHugo = document.getElementById("filtros-hugo");
  const vagasPrioritarias = filtrarVagas(
    TODAS,
    filtroClassificacao,
    filtroSituacao,
    true,
  );
  elHugo.innerHTML = `
    <button class="filtro-btn ${filtroMelhoresHugo ? "ativo" : ""}"
            data-hugo="prioritarias"
            aria-pressed="${filtroMelhoresHugo}"
            aria-label="Filtrar melhores oportunidades para Hugo">
      Melhores oportunidades para Hugo (${vagasPrioritarias.length})
    </button>
  `;
  elHugo.querySelector(".filtro-btn").addEventListener("click", () => {
    filtroMelhoresHugo = !filtroMelhoresHugo;
    montarFiltros();
    render();
  });
}

async function carregar() {
  try {
    const [resp, perfilResp] = await Promise.all([
      fetch("data/vagas.json", { cache: "no-store" }),
      fetch("config/perfil_hugo.json", { cache: "no-store" }),
    ]);
    if (!resp.ok) throw new Error("sem dados ainda");
    const dados = await resp.json();
    TODAS = dados.vagas || [];
    PERFIL_HUGO = perfilResp.ok ? await perfilResp.json() : null;

    document.getElementById("status").textContent =
      `${dados.total} oportunidades acompanhadas · atualizado em ${dataLisboa(dados.atualizado_em)}`;

    montarFiltros();
    render();
  } catch (e) {
    document.getElementById("status").textContent = "Ainda sem dados";
    document.getElementById("lista").innerHTML =
      '<p class="estado">O robô ainda não rodou a primeira vez, ou a página acabou de ser publicada.<br>Volta aqui daqui a pouco — isso se atualiza sozinho todo dia.</p>';
  }
}

// Mostra a dica de instalação só se parecer ser um iPhone/iPad fora do modo "app".
const ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const jaInstalado = window.navigator.standalone === true;
if (ehIOS && !jaInstalado) {
  document.getElementById("install-hint").classList.add("mostrar");
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

carregar();
</script>
</body>
</html>
